<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.I.A</title>
<style>
  :root{
    --bg:#4A6178;
    --surface:#5C7690;
    --surface-2:#4F6880;
    --surface-3:#435972;
    --border:rgba(255,255,255,0.12);
    --border-strong:rgba(255,255,255,0.24);
    --text:#FFFFFF;
    --text-muted:#C3D0DB;
    --text-faint:#8FA3B8;
    --producer:#DB8B1F;
    --motivator:#E85A46;
    --relator:#17A985;
    --prosessor:#4C6FEF;
    --objection:#8B5CF6;
    --note-font-size:12.5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(13,13,13,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'SF Mono',Consolas,Menlo,monospace;}
  .display{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:700; letter-spacing:-0.01em;}

  .wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:8px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0;color:var(--text-muted);font-size:13px;}

  .top-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:28px 0 24px;position:sticky;top:16px;z-index:10;}
  .tabs{display:flex;gap:4px;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;padding:4px;width:fit-content;box-shadow:0 8px 24px rgba(13,13,13,0.08);}
  .tab{padding:9px 18px;border-radius:9px;border:none;background:transparent;color:#4F6B80;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .tab:hover{color:#17222C;}
  .tab.active{background:#4A6178;color:#FFFFFF;font-weight:700;}
  .tab-refresh-btn{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1;transition:all .15s ease;margin-left:2px;}
  .edit-note-btn{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--surface-3);color:var(--text-muted);cursor:pointer;transition:all .15s ease;}
  .edit-note-btn:hover{color:var(--prosessor);border-color:var(--prosessor);}
  .tab-refresh-btn:hover{background:var(--surface-3);color:var(--text);transform:rotate(-45deg);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin:0 auto;}
  .panel-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#FFFFFF;font-weight:700;margin:0 0 14px;}

  .profile-pill{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1px solid var(--border);border-radius:12px;padding:8px 14px;box-shadow:0 8px 24px rgba(13,13,13,0.08);white-space:nowrap;}
  .profile-pill .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#4F6B80;font-weight:600;}
  .profile-pill .value{font-size:15px;font-weight:700;}
  .profile-pill .placeholder{font-size:12px;color:#4F6B80;}

  .qbank-item{border:1px solid rgba(13,13,13,0.12);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:#FFFFFF;color:#0D0D0D;}
  .profile-bubble{background:#FFFFFF;border-radius:16px;padding:20px;color:#0D0D0D;}
  .profile-bubble .modal-list li{color:#3A4750;}
  .profile-bubble .modal-desc{color:#3A4750;}
  .qbank-item p{margin:0;font-size:13.5px;line-height:1.45;}
  .use-btn{background:none;border:none;color:var(--prosessor);cursor:pointer;font-size:12px;font-weight:600;padding:0;margin-top:6px;}
  .font-size-btn{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text-muted);cursor:pointer;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
  .font-size-btn:hover{color:var(--text);border-color:var(--prosessor);}
  .use-btn:hover{text-decoration:underline;}

  .option-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .option-chip{background:#EDF1F5;border:1px solid rgba(13,13,13,0.15);color:#17222C;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s ease;font-family:inherit;}
  .option-chip:hover{border-color:var(--prosessor);background:#E0E8F0;transform:translateY(-1px);}
  .option-chip.selected{background:#4A6178;border-color:#4A6178;color:#FFFFFF;box-shadow:0 0 0 3px rgba(74,97,120,0.25);font-weight:600;}
  .qbank-item.skipped{opacity:.55;}
  .skipped-tag{font-size:10.5px;color:var(--text-faint);font-style:italic;margin:6px 0 0;}
  .no-options-note{font-size:11.5px;color:var(--text-faint);margin-top:8px;font-style:italic;}
  .script-note{width:100%;min-height:38px;margin-top:10px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:var(--note-font-size);line-height:1.5;resize:vertical;overflow:hidden;}
  .script-note-view{flex:1;padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:var(--note-font-size);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .note-saved-msg{font-size:11.5px;color:var(--relator);align-self:center;}
  .script-note:focus{outline:none;border-color:var(--border-strong);}
  .script-note::placeholder{color:var(--text-faint);}

  .btn{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:9px 16px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;}
  .btn:hover{border-color:rgba(255,255,255,.3);}

  .empty-state{color:var(--text-faint);font-size:13px;text-align:center;padding:24px 10px;border:1px dashed var(--border-strong);border-radius:11px;}

  .profile-pill.clickable{cursor:pointer;transition:border-color .15s ease;}
  .profile-pill.clickable:hover{border-color:var(--border-strong);}

  .modal-overlay{position:fixed;inset:0;background:rgba(13,13,13,0.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:60px 20px;overflow-y:auto;}
  .modal-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:18px;padding:28px;max-width:560px;width:100%;box-shadow:0 24px 60px rgba(13,13,13,0.18);}
  .modal-close{float:right;background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--text);}
  .modal-badge{font-size:24px;font-weight:700;padding:8px 16px;border-radius:10px;display:inline-block;margin-bottom:6px;}
  .modal-desc{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin:0 0 22px;white-space:pre-wrap;}
  .modal-section{margin-top:18px;}
  .modal-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:0 0 8px;}
  .modal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}

  .objection-box{margin-top:18px;background:#FFFFFF;border-radius:10px;padding:14px 16px;color:#0D0D0D;}
  .objection-label{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--objection);}
  .objection-stage{font-size:12.5px;color:#3A4750;line-height:1.5;margin:0 0 8px;}
  .objection-stage:last-child{margin-bottom:0;}
  .objection-stage-label{font-weight:700;margin-right:3px;}
  .modal-list li{font-size:13px;color:var(--text-muted);padding-left:16px;position:relative;line-height:1.5;}
  .modal-list li::before{content:"✓";position:absolute;left:0;color:var(--relator);font-size:11px;}
  .modal-list.warning-list li::before{content:"⚠";color:var(--motivator);}
  .modal-pitfall-cards{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .tips-columns{display:grid;grid-template-columns:repeat(3, 1fr);gap:18px;margin-top:18px;}
  .pitfall-columns{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;}
  @media (max-width:640px){
    .tips-columns{grid-template-columns:1fr;}
    .pitfall-columns{grid-template-columns:1fr;}
  }
  .modal-pitfall-card{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .modal-pitfall-title{margin:0 0 4px;font-size:12.5px;font-weight:600;padding-left:16px;position:relative;color:var(--motivator);}
  .modal-pitfall-title::before{content:"⚠";position:absolute;left:0;font-size:11px;}
  .modal-pitfall-detail{margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.5;padding-left:16px;}
</style>
</head>

// tallies every answered question (across all tabs) that has a known weight,
// and returns the category with the most votes plus the full vote breakdown
// only these tabs feed into the Producer/Motivator/Relator/Prosessor classification —
// Closing is used for objection-handling tips instead, see OBJECTION_TIPS below
const CLASSIFICATION_TABS = ["introduksjon"];

function computeClassification(){
  const scores = { Producer: 0, Motivator: 0, Relator: 0, Prosessor: 0 };
  let votes = 0;

  CLASSIFICATION_TABS.forEach(key => {
    const bank = state.questionBanks[key];
    const answers = session.bankAnswers[key];
    Object.keys(answers).forEach(i => {
      const question = bank[i].question;
      const answer = answers[i];
      const category = ANSWER_WEIGHTS[question] && ANSWER_WEIGHTS[question][answer];
      if(category){
        scores[category]++;
        votes++;
      }
    });
  });

  if(votes === 0) return null;

  const primary = CATEGORIES.reduce((best, cat) => scores[cat] > scores[best] ? cat : best, CATEGORIES[0]);
  return { primary, scores, votes };
}

// migrates an older plain-string question bank to the {question, options} shape
function normalizeBank(bank, tabKey){
  if(!bank || !bank.length) return (DEFAULT_BANKS[tabKey] || []).map(b => ({...b, options:[...b.options]}));
  return bank.map(item => typeof item === 'string' ? { question: item, options: [] } : { question: item.question, options: item.options || [] });
}

function emptySession(){
  const bankAnswers = {};
  QUESTION_TABS.forEach(t => { bankAnswers[t.key] = {}; });
  return { bankAnswers };
}

let state = { questionBanks: {
  introduksjon: normalizeBank(null, "introduksjon"),
  losning: normalizeBank(null, "losning")
}, scriptNotes: { introduksjon: {}, losning: {} } };
let session = emptySession();
let activeQuestionTab = "introduksjon";
let profileInfoExpanded = false;
let objectionInfoExpanded = false;
let noteMode = { introduksjon: {}, losning: {} }; // per question index: 'editing' | 'viewing' (absent = closed)
let stateVersion = null;

const STORAGE_KEY = "salgsbot-data";
const FONT_SIZE_STORAGE = "kundekompass-note-font-size";
const FONT_SIZE_MIN = 10;
const FONT_SIZE_MAX = 20;
const FONT_SIZE_DEFAULT = 12.5;

function applyNoteFontSize(px){
  document.documentElement.style.setProperty('--note-font-size', px + 'px');
}

function loadNoteFontSize(){
  let size = FONT_SIZE_DEFAULT;
  try{
    const saved = localStorage.getItem(FONT_SIZE_STORAGE);
    if(saved) size = parseFloat(saved);
  }catch(e){}
  applyNoteFontSize(size);
}

function adjustNoteFontSize(delta){
  const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--note-font-size'));
  const next = Math.min(FONT_SIZE_MAX, Math.max(FONT_SIZE_MIN, current + delta));
  applyNoteFontSize(next);
  try{ localStorage.setItem(FONT_SIZE_STORAGE, next); }catch(e){}
  document.querySelectorAll('.script-note').forEach(box => {
    box.style.height = 'auto';
    box.style.height = box.scrollHeight + 'px';
  });
}


// one-off rewordings: replace an exact old option set with a corrected one,
// without touching questions the user has customized differently
const OPTION_RENAMES = [
  {
    question: "Snakker jeg med [navn]?",
    from: ["Ja", "Jaa (energisk)", "Kortfattet Ja (monoton)", "Spørrende/usikker JA", "Forsiktig Ja", "Streng Ja"],
    to: ["Ja (energisk)", "Ja (monoton)", "Ja (spørrende/usikker)", "Ja (forsiktig)", "Ja (streng)"]
  }
];
function arraysEqual(a,b){ return a.length === b.length && a.every((v,i) => v === b[i]); }

async function loadState(){
  let parsedBanks = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.questionBanks){
        parsedBanks = parsed.questionBanks;
        QUESTION_TABS.forEach(t => { state.questionBanks[t.key] = normalizeBank(parsed.questionBanks[t.key], t.key); });
      } else if(parsed.questionBank){
        // migrate older single-bank save into the "introduksjon" tab
        state.questionBanks.introduksjon = normalizeBank(parsed.questionBank, "introduksjon");
      }
      if(parsed.scriptNotes){
        QUESTION_TABS.forEach(t => { state.scriptNotes[t.key] = parsed.scriptNotes[t.key] || {}; });
      }
    }
  }catch(e){
    // no existing data yet — keep defaults
  }

  QUESTION_TABS.forEach(t => {
    Object.keys(state.scriptNotes[t.key] || {}).forEach(i => {
      if(state.scriptNotes[t.key][i]) noteMode[t.key][parseInt(i)] = 'viewing';
    });
  });

  // one-off migration: "Behovsanalyse" tab was removed and its question moved into
  // "Introduksjon" — pull it over from an older save if it's not already there
  let filled = false;
  const NEEDS_QUESTION = "Hva er grunnen til at du valgte å støtte oss?";
  const hasQuestion = state.questionBanks.introduksjon.some(item => item.question === NEEDS_QUESTION);
  if(!hasQuestion){
    const legacyItem = parsedBanks && parsedBanks.behovsanalyse && parsedBanks.behovsanalyse.find(item => item.question === NEEDS_QUESTION);
    const options = legacyItem && legacyItem.options && legacyItem.options.length ? legacyItem.options : SUGGESTED_OPTIONS[NEEDS_QUESTION] || [];
    state.questionBanks.introduksjon.push({ question: NEEDS_QUESTION, options: [...options] });
    filled = true;
  }

  // one-off migration: "Closing" tab was removed and its question moved into
  // "Løsning" — pull it over from an older save if it's not already there
  const CLOSING_QUESTION = "Kan du hjelpe oss med det?";
  const losningHasClosingQuestion = state.questionBanks.losning.some(item => item.question === CLOSING_QUESTION);
  if(!losningHasClosingQuestion){
    const legacyClosingItem = parsedBanks && parsedBanks.closing && parsedBanks.closing.find(item => item.question === CLOSING_QUESTION);
    const options = legacyClosingItem && legacyClosingItem.options && legacyClosingItem.options.length ? legacyClosingItem.options : SUGGESTED_OPTIONS[CLOSING_QUESTION] || [];
    state.questionBanks.losning.push({ question: CLOSING_QUESTION, options: [...options] });
    filled = true;
  }

  // one-off cleanup: these two questions used to live in "introduksjon" but were
  // removed / moved to "closing" — strip them out of any older saved bank
  const REMOVED_FROM_INTRODUKSJON = [
    "Som du sikkert forstår … (utdyper om en krise som trenger støtte)",
    "Kan du hjelpe oss med det?"
  ];
  const introLenBefore = state.questionBanks.introduksjon.length;
  state.questionBanks.introduksjon = state.questionBanks.introduksjon.filter(item => !REMOVED_FROM_INTRODUKSJON.includes(item.question));
  if(introLenBefore !== state.questionBanks.introduksjon.length) filled = true;

  // one-off cleanup: "Pensjonist/Student" option removed from "Kan du hjelpe oss med det?"
  const closingItem = state.questionBanks.losning.find(item => item.question === CLOSING_QUESTION);
  if(closingItem && closingItem.options.includes("Pensjonist/Student")){
    closingItem.options = closingItem.options.filter(o => o !== "Pensjonist/Student");
    filled = true;
  }

  // one-off addition: "Ønsker ikke binding" option added to "Kan du hjelpe oss med det?"
  if(closingItem && !closingItem.options.includes("Ønsker ikke binding")){
    const neiIdx = closingItem.options.indexOf("Nei");
    const insertAt = neiIdx >= 0 ? neiIdx : closingItem.options.length;
    closingItem.options.splice(insertAt, 0, "Ønsker ikke binding");
    filled = true;
  }

  // one-off merge: "Nei" and "Ikke interessert" combined into a single "Nei, ikke interessert" option
  if(closingItem && (closingItem.options.includes("Nei") || closingItem.options.includes("Ikke interessert"))){
    const neiIdx2 = closingItem.options.indexOf("Nei");
    const insertAt2 = neiIdx2 >= 0 ? neiIdx2 : closingItem.options.length;
    closingItem.options = closingItem.options.filter(o => o !== "Nei" && o !== "Ikke interessert");
    if(!closingItem.options.includes("Nei, ikke interessert")){
      closingItem.options.splice(insertAt2, 0, "Nei, ikke interessert");
    }
    filled = true;
  }

  // one-off cleanup: "Nei, avvisende og konkret" option removed from "Husker du dette?"
  const huskerItem = state.questionBanks.introduksjon.find(item => item.question === "Husker du dette? (snakke om tidligere bidrag)");
  if(huskerItem && huskerItem.options.includes("Nei, avvisende og konkret")){
    huskerItem.options = huskerItem.options.filter(o => o !== "Nei, avvisende og konkret");
    filled = true;
  }

  // auto-fill known suggestions / apply one-off renames for questions that already
  // exist (e.g. from an older save) but still have the old or missing options
  QUESTION_TABS.forEach(t => {
    state.questionBanks[t.key].forEach(item => {
      if(item.options.length === 0 && SUGGESTED_OPTIONS[item.question]){
        item.options = [...SUGGESTED_OPTIONS[item.question]];
        filled = true;
      }
      const renameRule = OPTION_RENAMES.find(r => r.question === item.question && arraysEqual(item.options, r.from));
      if(renameRule){
        item.options = [...renameRule.to];
        filled = true;
      }
    });
  });
  if(filled) saveState();
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("Kunne ikke lagre:", e);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---------- ANALYSE TAB ----------
function renderAnalyseTab(){
  const tabLabel = QUESTION_TABS.find(t => t.key === activeQuestionTab).label;
  const bank = state.questionBanks[activeQuestionTab];
  const total = bank.length;
  const answers = session.bankAnswers[activeQuestionTab];
  const currentClassification = computeClassification();
  let bankOptions = '';

  if(total === 0){
    bankOptions = `<div class="empty-state">Ingen spørsmål lagt til for ${tabLabel} ennå.</div>`;
  } else {
    for(let i = 0; i < total; i++){
      const item = bank[i];
      const isAnswered = answers.hasOwnProperty(i);

      const chips = item.options.length
        ? `<div class="option-chips">${item.options.map((opt,oi) => {
            const sel = isAnswered && answers[i] === opt;
            return `<button class="option-chip${sel ? ' selected' : ''}" data-pick-answer="${i}:${oi}">${escapeHtml(opt)}</button>`;
          }).join('')}</div>`
        : `<p class="no-options-note">Ingen svaralternativer lagt til for dette spørsmålet ennå.</p>`;

      const objectionEntry = (activeQuestionTab === 'losning' && isAnswered)
        ? OBJECTION_TIPS[item.question] && OBJECTION_TIPS[item.question][answers[i]]
        : null;
      const objectionTips = (objectionEntry && currentClassification) ? objectionEntry[currentClassification.primary] : null;
      const objectionStages = [
        { label: "F", color: "var(--relator)", text: objectionTips && objectionTips.forsta },
        { label: "A", color: "var(--prosessor)", text: objectionTips && objectionTips.argumenter },
        { label: "C", color: "var(--motivator)", text: objectionTips && objectionTips.close }
      ];
      const objectionInfoHtml = objectionInfoExpanded ? `
        <p class="objection-stage" style="margin-top:8px;">Forstå, argumenter og close er en enkel struktur for å møte en innvending: vis at du forstår, gi et motargument, og avslutt med et konkret spørsmål.</p>
      ` : '';
      const objectionHtml = objectionTips ? `
        <div class="objection-box">
          <div style="display:flex; align-items:center; gap:8px;">
            <p class="objection-label" style="margin-bottom:0;">Innvendingshåndtering</p>
            <button class="edit-note-btn" id="objection-info-toggle" title="${objectionInfoExpanded ? 'Skjul informasjon' : 'Mer informasjon'}" aria-label="Mer informasjon" style="width:24px; height:24px; font-size:13px; font-weight:700; font-style:italic; font-family:Georgia, serif;">i</button>
          </div>
          ${objectionInfoHtml}
          <div style="margin-top:12px;">
            ${objectionStages.map(s => `<p class="objection-stage"><span class="objection-stage-label" style="color:${s.color}">${s.label}:</span> ${escapeHtml(s.text)}</p>`).join('')}
          </div>
        </div>` : '';

      const savedNote = (state.scriptNotes[activeQuestionTab] && state.scriptNotes[activeQuestionTab][i]) || '';
      const mode = noteMode[activeQuestionTab][i]; // undefined | 'editing' | 'viewing'
      const addNoteBtn = `<button class="edit-note-btn" data-add-note="${i}" title="Legg til egen tekst" aria-label="Legg til egen tekst" style="font-size:16px; font-weight:600;">+</button>`;
      const fontSizeControls = `<span style="margin-left:auto; display:flex; gap:6px;">
             <button class="font-size-btn" data-font-decrease title="Mindre skrift">A−</button>
             <button class="font-size-btn" data-font-increase title="Større skrift">A+</button>
           </span>`;

      let noteHtml = '';
      if(mode === 'editing'){
        noteHtml = `<textarea class="script-note" data-note-idx="${i}" placeholder="Skriv din egen tekst her …">${escapeHtml(savedNote)}</textarea>
           <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
             <button class="use-btn" data-save-note="${i}">Lagre</button>
             <button class="use-btn" data-close-note="${i}">Lukk</button>
             ${fontSizeControls}
           </div>`;
      } else if(mode === 'viewing'){
        noteHtml = `<div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
             <div class="script-note-view">${escapeHtml(savedNote)}</div>
             <button class="edit-note-btn" data-edit-note="${i}" title="Rediger" aria-label="Rediger">
               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
             </button>
           </div>
           <div style="display:flex; margin-top:6px;">${fontSizeControls}</div>`;
      }

      bankOptions += `
        <div class="qbank-item" data-bank-idx="${i}">
           <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
             <p style="color:var(--text-faint); font-size:10.5px; margin:0;">Spørsmål ${i+1} av ${total}</p>
             ${mode ? '' : addNoteBtn}
           </div>
           ${noteHtml}
           <p style="margin-top:10px; font-weight:700;">${escapeHtml(item.question)}</p>
           ${chips}
        </div>
        ${objectionHtml}`;
    }
  }

  const isLosning = activeQuestionTab === 'losning';
  let bodyHtml;

  if(isLosning){
    const c = computeClassification();
    const bankHtml = bankOptions ? `<div id="bank-list"${c ? ' style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border);"' : ''}>${bankOptions}</div>` : '';
    if(c){
      bodyHtml = `${renderProfileTipsTop(c.primary)}${bankHtml}`;
    } else {
      bodyHtml = bankHtml;
    }
  } else {
    bodyHtml = bankOptions ? `<div id="bank-list">${bankOptions}</div>` : '';
  }

  document.getElementById('content').innerHTML = `
    <div class="panel" style="max-width:${isLosning ? '760px' : '620px'};">
      <p class="panel-title">${tabLabel}</p>
      ${bodyHtml}
    </div>
  `;

  updateProfilePill();
  attachAnalyseListeners();
}

function renderProfileTipsTop(type){
  const info = PROFILE_INFO[type];
  const expandedHtml = profileInfoExpanded ? `
    <div style="margin-top:12px;">
      <p class="modal-desc" style="margin-bottom:0;">${info.description}</p>
    </div>
  ` : '';

  return `
    <div class="profile-bubble">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="modal-badge" style="background:${COLORS[type]}22; color:${COLORS[type]}; border:1px solid ${COLORS[type]}55; font-size:13px; text-transform:uppercase; letter-spacing:.06em; padding:5px 12px; margin-bottom:0;">${type}</span>
        <button class="edit-note-btn" id="profile-info-toggle" title="${profileInfoExpanded ? 'Skjul informasjon' : 'Mer informasjon om ' + type}" aria-label="Mer informasjon om ${type}" style="width:24px; height:24px; font-size:13px; font-weight:700; font-style:italic; font-family:Georgia, serif;">i</button>
      </div>

      ${expandedHtml}

      <div class="tips-columns" style="grid-template-columns:1fr 1fr; margin-top:18px;">
        <div class="modal-section" style="margin-top:0;">
          <p class="modal-section-title" style="color:var(--relator)">Tips</p>
          <ul class="modal-list">${info.keyPoints.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
        </div>

        <div class="modal-section" style="margin-top:0;">
          <p class="modal-section-title" style="color:var(--motivator)">Fallgruver</p>
          <ul class="modal-list warning-list">${info.pitfalls.map(p => `<li>${escapeHtml(p.title)}${p.detail ? ' — ' + escapeHtml(p.detail) : ''}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
  `;
}

function updateProfilePill(){
  const c = computeClassification();
  const pill = document.getElementById('profile-pill');
  if(!c){
    pill.className = 'profile-pill';
    pill.innerHTML = `<span class="placeholder">Svar for å se profil</span>`;
    pill.onclick = null;
    return;
  }
  pill.className = 'profile-pill clickable';
  pill.innerHTML = `
    <span class="label">Profil</span>
    <span class="value" style="color:${COLORS[c.primary]}">${c.primary}</span>
  `;
  pill.onclick = () => openProfileModal(c.primary);
}

function openProfileModal(type){
  const info = PROFILE_INFO[type];
  const box = document.getElementById('profile-modal-box');
  const needsAssessmentHtml = info.needsAssessment ? `
    <div class="modal-section">
      <p class="modal-section-title" style="color:var(--relator)">Behovsavdekking</p>
      <ul class="modal-list">${info.needsAssessment.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
    </div>
  ` : '';
  box.innerHTML = `
    <button class="modal-close" onclick="closeProfileModal()">✕</button>
    <span class="modal-badge" style="background:${COLORS[type]}22; color:${COLORS[type]}; border:1px solid ${COLORS[type]}55;">${type}</span>
    <p class="modal-desc">${info.description}</p>

    ${needsAssessmentHtml}

    <div class="modal-section">
      <p class="modal-section-title" style="color:var(--relator)">Pitch</p>
      <ul class="modal-list">${info.pitch.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
    </div>

    <div class="modal-section">
      <p class="modal-section-title" style="color:var(--relator)">Innvendingshåndtering</p>
      <ul class="modal-list">${info.objections.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
    </div>

    <div class="modal-section">
      <p class="modal-section-title" style="color:var(--relator)">Closing</p>
      <ul class="modal-list">${info.closing.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
    </div>

    <div class="modal-section">
      <p class="modal-section-title" style="color:var(--motivator)">Fallgruver</p>
      <div class="modal-pitfall-cards">
        ${info.pitfalls.map(p => `
          <div class="modal-pitfall-card">
            <p class="modal-pitfall-title">${escapeHtml(p.title)}</p>
            ${p.detail ? `<p class="modal-pitfall-detail">${escapeHtml(p.detail)}</p>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('profile-modal').style.display = 'flex';
}

function closeProfileModal(){
  document.getElementById('profile-modal').style.display = 'none';
}

function attachAnalyseListeners(){
  const profileInfoToggleBtn = document.getElementById('profile-info-toggle');
  if(profileInfoToggleBtn) profileInfoToggleBtn.addEventListener('click', () => {
    profileInfoExpanded = !profileInfoExpanded;
    renderAnalyseTab();
  });

  const objectionInfoToggleBtn = document.getElementById('objection-info-toggle');
  if(objectionInfoToggleBtn) objectionInfoToggleBtn.addEventListener('click', () => {
    objectionInfoExpanded = !objectionInfoExpanded;
    renderAnalyseTab();
  });

  document.querySelectorAll('[data-font-decrease]').forEach(btn => {
    btn.addEventListener('click', () => adjustNoteFontSize(-1));
  });
  document.querySelectorAll('[data-font-increase]').forEach(btn => {
    btn.addEventListener('click', () => adjustNoteFontSize(1));
  });

  document.querySelectorAll('[data-pick-answer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [qi, oi] = btn.dataset.pickAnswer.split(':').map(Number);
      const bank = state.questionBanks[activeQuestionTab];
      const answers = session.bankAnswers[activeQuestionTab];
      const item = bank[qi];
      const clickedOption = item.options[oi];

      let justAnswered = false;
      if(answers[qi] === clickedOption){
        // clicking the already-selected answer again un-answers the question
        delete answers[qi];
      } else {
        answers[qi] = clickedOption;
        justAnswered = true;
      }

      const allIntroduksjonAnswered = activeQuestionTab === 'introduksjon'
        && state.questionBanks.introduksjon.length > 0
        && Object.keys(session.bankAnswers.introduksjon).length === state.questionBanks.introduksjon.length;

      if(allIntroduksjonAnswered){
        switchQuestionTab('losning');
      } else {
        renderAnalyseTab();
        if(justAnswered){
          const nextCard = document.querySelector(`.qbank-item[data-bank-idx="${qi + 1}"]`);
          if(nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    });
  });

  document.querySelectorAll('.script-note[data-note-idx]').forEach(box => {
    box.addEventListener('input', () => {
      const i = box.dataset.noteIdx;
      if(!state.scriptNotes[activeQuestionTab]) state.scriptNotes[activeQuestionTab] = {};
      state.scriptNotes[activeQuestionTab][i] = box.value;
      saveState();
      box.style.height = 'auto';
      box.style.height = box.scrollHeight + 'px';
    });
  });

  document.querySelectorAll('.script-note').forEach(box => {
    box.style.height = 'auto';
    box.style.height = box.scrollHeight + 'px';
  });

  document.querySelectorAll('[data-add-note]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.addNote);
      noteMode[activeQuestionTab][i] = 'editing';
      renderAnalyseTab();
      const box = document.querySelector(`.script-note[data-note-idx="${i}"]`);
      if(box) box.focus();
    });
  });

  document.querySelectorAll('[data-edit-note]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.editNote);
      noteMode[activeQuestionTab][i] = 'editing';
      renderAnalyseTab();
      const box = document.querySelector(`.script-note[data-note-idx="${i}"]`);
      if(box) box.focus();
    });
  });

  document.querySelectorAll('[data-save-note]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.saveNote);
      const box = document.querySelector(`.script-note[data-note-idx="${i}"]`);
      const text = box ? box.value : '';
      if(!state.scriptNotes[activeQuestionTab]) state.scriptNotes[activeQuestionTab] = {};
      state.scriptNotes[activeQuestionTab][i] = text;
      saveState();
      noteMode[activeQuestionTab][i] = text.trim() ? 'viewing' : undefined;
      renderAnalyseTab();
    });
  });

  document.querySelectorAll('[data-close-note]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.closeNote);
      const box = document.querySelector(`.script-note[data-note-idx="${i}"]`);
      const text = box ? box.value : '';
      if(!state.scriptNotes[activeQuestionTab]) state.scriptNotes[activeQuestionTab] = {};
      state.scriptNotes[activeQuestionTab][i] = text;
      saveState();
      noteMode[activeQuestionTab][i] = text.trim() ? 'viewing' : undefined;
      renderAnalyseTab();
    });
  });
}

function render(){
  renderAnalyseTab();
}

function switchQuestionTab(key){
  activeQuestionTab = key;
  document.querySelectorAll('#question-tabs .tab').forEach(b => b.classList.toggle('active', b.dataset.qtab === key));
  renderAnalyseTab();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function initQuestionTabs(){
  document.querySelectorAll('#question-tabs .tab').forEach(btn => {
    btn.addEventListener('click', () => {
      switchQuestionTab(btn.dataset.qtab);
    });
  });

  document.getElementById('refresh-btn').addEventListener('click', () => {
    session = emptySession();
    renderAnalyseTab();
  });
}

loadNoteFontSize();
initQuestionTabs();
loadState();
</script>
</body>
</html>
